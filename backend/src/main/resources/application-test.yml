server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:emergency_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

aegisops:
  jwt:
    secret: aegisops-super-secure-production-jwt-key-2026-spring-edition-minimum-32-chars
    expiration-ms: 3600000

