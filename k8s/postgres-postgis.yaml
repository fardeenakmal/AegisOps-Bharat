apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-postgis
  namespace: aegisops-production
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-postgis
  template:
    metadata:
      labels:
        app: postgres-postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "emergency_db"
            - name: POSTGRES_USER
              value: "emergency_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisops-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aegisops-production
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-postgis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: aegisops-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aegisops-production
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
