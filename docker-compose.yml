version: '3.8'

services:
  mysql:
    image: mysql:8.4-lts
    container_name: emergency-mysql
    environment:
      MYSQL_DATABASE: emergency_db
      MYSQL_USER: emergency_user
      MYSQL_PASSWORD: emergency_secure_pass_2026
      MYSQL_ROOT_PASSWORD: root_secure_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u emergency_user -pemergency_secure_pass_2026 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emergency-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency-backend
    environment:
      SERVER_PORT: 4000
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/emergency_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: emergency_user
      SPRING_DATASOURCE_PASSWORD: emergency_secure_pass_2026
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: aegisops-super-secure-production-jwt-key-2026-spring-edition-minimum-32-chars
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  mysqldata:
