version: '3.8'

services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: emergency-postgis
    environment:
      POSTGRES_DB: emergency_db
      POSTGRES_USER: emergency_user
      POSTGRES_PASSWORD: emergency_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency_user -d emergency_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emergency-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://emergency_user:emergency_secure_pass_2026@postgres-postgis:5432/emergency_db
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
